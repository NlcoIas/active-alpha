# Development overrides — use with:
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up
#
# Adds port mappings for local access, volume mounts for live reload,
# and sets development environment.

services:
  backend:
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=development
    volumes:
      - ./backend:/app

  db:
    ports:
      - "5433:5432"

  redis:
    ports:
      - "6380:6379"
